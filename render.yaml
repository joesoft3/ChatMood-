# ChatMood — Render blueprint (docs/BACKEND-HOSTING.md · Path B).
# Render → New → Blueprint → paste the repo URL. Secrets (sync: false) are
# prompted once in the dashboard; everything else is automatic.

services:
  - type: web
    name: mood-api
    runtime: docker
    rootDir: backend
    plan: starter
    # Readiness, not liveness: /healthz is 200 whenever the process is alive, so a
    # broken DATABASE_URL used to sail through the check and serve 500s. /readyz
    # 503s when a REQUIRED dependency (READINESS_REQUIRED, default postgres) is
    # unreachable, so a bad deploy is caught here instead of by users.
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mood-db
          property: connectionString  # Settings normalizes it to postgresql+asyncpg://
      - key: REDIS_URL
        fromService:
          type: redis
          name: mood-redis
          property: connectionString
      - key: QDRANT_URL
        value: http://mood-qdrant:6333
      # This blueprint provisions Redis + Qdrant, so you *may* gate readiness on
      # all three. Left at the default (postgres) on purpose: the app degrades
      # gracefully without Redis/Qdrant, and a transient blip in either should
      # not pull a still-serving instance out of the load balancer.
      # - key: READINESS_REQUIRED
      #   value: postgres,redis,qdrant
      - key: UPLOAD_DIR
        value: /data/storage
      # --- secrets: fill in the Render dashboard when prompted ---
      - key: JWT_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false  # https://<your-site>.netlify.app,https://app.your-domain.com
      - key: FRONTEND_URL
        sync: false  # https://<your-site>.netlify.app
    disk:
      name: mood-uploads
      mountPath: /data/storage
      sizeGB: 5

  - type: redis
    name: mood-redis
    plan: free
    ipAllowList: []  # internal only

  - type: pserv
    name: mood-qdrant
    runtime: image
    image:
      url: docker.io/qdrant/qdrant:latest
    plan: starter
    disk:
      name: mood-qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5

databases:
  - name: mood-db
    databaseName: mood
    user: mood
    plan: free
