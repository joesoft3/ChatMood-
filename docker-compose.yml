name: mood-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mood
      POSTGRES_PASSWORD: mood
      POSTGRES_DB: mood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mood"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mood:mood@db:5432/mood
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /app/storage
      CORS_ORIGINS: http://localhost:3000
      # This stack really does run all three, and `frontend` waits on this
      # healthcheck — so gate readiness on the full set here. A local stack where
      # Redis or Qdrant failed to come up should report itself broken, not
      # silently start the UI against a half-wired backend.
      READINESS_REQUIRED: postgres,redis,qdrant
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage
    healthcheck:
      # /readyz (not /healthz): `frontend` gates on service_healthy, so the check
      # must mean "dependencies wired", not merely "uvicorn is listening".
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s   # alembic + pgvector DDL run before the first ready 200
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

  # Optional edge proxy for custom domains (connect/buy in Settings → Domains):
  #   docker compose --profile edge up -d
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  caddydata: {}
  caddyconfig: {}
  pgdata: {}
  qdrantdata: {}
  uploads: {}
